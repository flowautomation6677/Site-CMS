
name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v4

    - name: Setup Node.js ⚙️
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies 📦
      run: npm ci

    - name: Build 🏗️
      run: npm run build

    - name: Deploy to Hostinger via LFTP 🚀
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp
        lftp -e "set ssl:verify-certificate no; open ${{ secrets.FTP_SERVER }}; user ${{ secrets.FTP_USERNAME }} '${{ secrets.FTP_PASSWORD }}'; mirror -R --verbose --parallel=10 ./out ./public_html; bye"
